<!DOCTYPE html>
<html lang="zh-CN" data-theme="candy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4E2">
<title>校园助理 · 小助理</title>
<style>
/* ================= 基础 ================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html,body{height:100%}
html[data-theme="candy"]{color-scheme:light}
html[data-theme="aurora"]{color-scheme:dark}
body{
  font-family:var(--font);
  background:#ECEBEF;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;border:0;outline:0;background:none;color:inherit}
img{display:block}

/* ================= 外壳 ================= */
.app{
  position:relative;width:100%;max-width:440px;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .45s ease;
}
.main{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.sidebar,.chatpane{display:none}

/* ================= 主题：元气糖果（默认） ================= */
html[data-theme="candy"] .app{
  background:linear-gradient(168deg,#FFF4E2 0%,#FFE8F1 46%,#E7F7F3 100%);
  color:#231F1C;
}
html[data-theme="candy"] .app::before{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;
  top:-90px;right:-90px;pointer-events:none;
  background:radial-gradient(circle,rgba(255,122,89,.30),transparent 68%);
}
html[data-theme="candy"] .app::after{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  bottom:70px;left:-110px;pointer-events:none;
  background:radial-gradient(circle,rgba(78,205,196,.28),transparent 68%);
}
[data-theme="candy"] .topbar{color:#231F1C}
[data-theme="candy"] .greet{color:rgba(35,31,28,.55)}
[data-theme="candy"] .avatar{
  background:#FFD23F;border:2.5px solid #231F1C;box-shadow:3px 3px 0 #231F1C;color:#231F1C
}
[data-theme="candy"] .icon-btn{
  background:#fff;border:2px solid #231F1C;box-shadow:2px 2px 0 #231F1C;border-radius:9px
}
[data-theme="candy"] .card{
  background:#fff;border:2.5px solid #231F1C;border-radius:22px;box-shadow:6px 6px 0 #FF7A59
}
[data-theme="candy"] .eyebrow{color:#FF7A59}
[data-theme="candy"] .pill{
  background:#FF7A59;color:#fff;border:2px solid #231F1C;font-weight:850;padding:3px 10px;border-radius:99px
}
[data-theme="candy"] .pill.warn{background:#231F1C;color:#FFD23F}
[data-theme="candy"] .btn-main{
  background:#FF7A59;color:#fff;border:2.5px solid #231F1C;box-shadow:3px 3px 0 #231F1C;border-radius:12px
}
[data-theme="candy"] .bar{background:#F2E7DA;border:1.5px solid #231F1C;height:8px}
[data-theme="candy"] .bar i{background:repeating-linear-gradient(45deg,#4ECDC4 0 5px,#6FE0D8 5px 10px)}
[data-theme="candy"] .item{
  background:#fff;border:2px solid #231F1C;border-radius:16px;box-shadow:3.5px 3.5px 0 #FFD23F
}
[data-theme="candy"] .item-ic{background:#FFE9DE;border:1.5px solid #231F1C;color:#E0552F;border-radius:8px}
[data-theme="candy"] .item-d{background:#231F1C;color:#fff;border-radius:6px;padding:2.5px 7px}
[data-theme="candy"] .item-d.soon{background:#FF7A59}
[data-theme="candy"] .chip{
  background:#fff;border:2px solid #231F1C;box-shadow:2.5px 2.5px 0 #4ECDC4;border-radius:99px;font-weight:750
}
[data-theme="candy"] .composer-in{
  background:#fff;border:2.5px solid #231F1C;box-shadow:3.5px 3.5px 0 #4ECDC4;border-radius:18px
}
[data-theme="candy"] .send{background:#FF7A59;color:#fff;border:2px solid #231F1C;border-radius:10px}
[data-theme="candy"] .tabbar{
  background:rgba(255,255,255,.82);border-top:2px solid #231F1C;backdrop-filter:blur(14px)
}
[data-theme="candy"] .tab{color:rgba(35,31,28,.45)}
[data-theme="candy"] .tab.on{color:#231F1C}
[data-theme="candy"] .tab.on .dot{background:#FF7A59;border:1.5px solid #231F1C}
[data-theme="candy"] .bubble-a{
  background:#fff;border:2px solid #231F1C;border-radius:16px 16px 16px 5px;box-shadow:3px 3px 0 #FFD23F
}
[data-theme="candy"] .bubble-u{
  background:#231F1C;color:#fff;border:2px solid #231F1C;border-radius:16px 16px 5px 16px
}
[data-theme="candy"] .sheet{
  background:#FFF8EE;border:2.5px solid #231F1C;border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(35,31,28,.18)
}
[data-theme="candy"] .field{
  background:#fff;border:2px solid #231F1C;border-radius:13px
}
[data-theme="candy"] .theme-card{border:2px solid #231F1C;border-radius:16px;box-shadow:3px 3px 0 #FFD23F}
[data-theme="candy"] .theme-card.on{box-shadow:3px 3px 0 #FF7A59;border-width:2.5px}
[data-theme="candy"] .sec-title{color:rgba(35,31,28,.5)}
[data-theme="candy"] .hint{color:rgba(35,31,28,.42)}
[data-theme="candy"] .empty{color:rgba(35,31,28,.4)}

/* ================= 主题：极光玻璃 ================= */
html[data-theme="aurora"] .app{
  background:#070a1c;color:#fff;
}
html[data-theme="aurora"] .app::before{
  content:"";position:absolute;inset:-30%;pointer-events:none;
  background:
    radial-gradient(44% 36% at 16% 8%,rgba(139,92,246,.95),transparent 60%),
    radial-gradient(36% 30% at 86% 16%,rgba(56,189,248,.8),transparent 62%),
    radial-gradient(46% 34% at 70% 86%,rgba(236,72,153,.6),transparent 64%),
    radial-gradient(28% 22% at 6% 70%,rgba(45,212,191,.42),transparent 66%);
  filter:blur(34px);animation:auroraShift 16s ease-in-out infinite alternate
}
html[data-theme="aurora"] .app::after{content:none}
@keyframes auroraShift{to{transform:translate3d(4%,3%,0) scale(1.1) rotate(8deg)}}
[data-theme="aurora"] .topbar{color:#fff}
[data-theme="aurora"] .greet{color:rgba(255,255,255,.56)}
[data-theme="aurora"] .avatar{
  background:linear-gradient(140deg,#a78bfa,#22d3ee);color:#070d20;
  box-shadow:0 8px 24px -6px rgba(124,58,237,.8)
}
[data-theme="aurora"] .icon-btn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:9px}
[data-theme="aurora"] .card{
  background:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.17);border-radius:22px;
  backdrop-filter:blur(16px);box-shadow:0 20px 44px -24px rgba(0,0,0,.9)
}
[data-theme="aurora"] .eyebrow{color:rgba(255,255,255,.6)}
[data-theme="aurora"] .pill{
  background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#06091a;font-weight:850;
  padding:4px 10px;border-radius:99px;box-shadow:0 4px 16px -4px rgba(34,211,238,.8)
}
[data-theme="aurora"] .pill.warn{background:rgba(255,255,255,.92);color:#0b0c10}
[data-theme="aurora"] .btn-main{
  background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#070c1e;
  border-radius:12px;box-shadow:0 8px 22px -8px rgba(34,211,238,.9)
}
[data-theme="aurora"] .bar{background:rgba(255,255,255,.14);height:5px}
[data-theme="aurora"] .bar i{background:linear-gradient(90deg,#a78bfa,#22d3ee);box-shadow:0 0 12px rgba(34,211,238,.75)}
[data-theme="aurora"] .item{
  background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.1);border-radius:16px
}
[data-theme="aurora"] .item-ic{background:rgba(167,139,250,.2);color:#c4b5fd;border-radius:9px}
[data-theme="aurora"] .item-d{color:#7dd3fc}
[data-theme="aurora"] .item-d.soon{color:#fda4af}
[data-theme="aurora"] .chip{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.88);
  border-radius:99px
}
[data-theme="aurora"] .composer-in{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:18px;backdrop-filter:blur(14px)
}
[data-theme="aurora"] .send{background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#070c1e;border-radius:10px}
[data-theme="aurora"] .tabbar{
  background:rgba(10,12,32,.72);border-top:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px)
}
[data-theme="aurora"] .tab{color:rgba(255,255,255,.42)}
[data-theme="aurora"] .tab.on{color:#fff}
[data-theme="aurora"] .tab.on .dot{background:linear-gradient(135deg,#a78bfa,#22d3ee)}
[data-theme="aurora"] .bubble-a{
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.15);border-radius:16px 16px 16px 5px
}
[data-theme="aurora"] .bubble-u{
  background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#070c1e;
  border-radius:16px 16px 5px 16px
}
[data-theme="aurora"] .sheet{
  background:#0d1030;border:1px solid rgba(255,255,255,.12);border-radius:26px 26px 0 0;
  box-shadow:0 -12px 50px rgba(0,0,0,.7)
}
[data-theme="aurora"] .field{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:13px
}
[data-theme="aurora"] .theme-card{border:1px solid rgba(255,255,255,.2);border-radius:16px}
[data-theme="aurora"] .theme-card.on{border:2px solid #7dd3fc;box-shadow:0 0 24px -6px rgba(125,211,252,.7)}
[data-theme="aurora"] .sec-title{color:rgba(255,255,255,.42)}
[data-theme="aurora"] .hint{color:rgba(255,255,255,.4)}
[data-theme="aurora"] .empty{color:rgba(255,255,255,.4)}

/* ================= 顶栏 ================= */
.topbar{
  position:relative;z-index:5;flex:none;
  display:flex;align-items:center;gap:11px;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px 10px
}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;
  display:grid;place-items:center;overflow:hidden;
  font-size:17px;font-weight:850;letter-spacing:.02em;
  transition:transform .2s
}
.avatar:active{transform:scale(.94)}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.who b{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.greet{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:14px;letter-spacing:1px}

/* ================= 视图 ================= */
.views{position:relative;flex:1;min-height:0;z-index:4}
.view{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:6px 18px 16px;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .22s ease, transform .22s ease;
  -webkit-overflow-scrolling:touch
}
.view.on{opacity:1;pointer-events:auto;transform:none}
.view::-webkit-scrollbar{width:0}
#view-home{display:flex;flex-direction:column}
#view-home .chips{margin-top:auto}

/* ================= 首页 ================= */
.card{
  border-radius:22px;padding:15px 16px 15px;
  display:flex;flex-direction:column;gap:4px;
  position:relative;overflow:hidden
}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:9.5px;font-weight:850;letter-spacing:.15em;text-transform:uppercase}
.pill{font-size:10.5px;font-weight:800;white-space:nowrap}
.card h2{font-size:16.5px;font-weight:800;letter-spacing:-.015em;line-height:1.28;margin-top:6px}
.card .sub{font-size:11px;opacity:.6;margin-top:1px}
.bar{height:5px;border-radius:99px;margin-top:11px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.3,1)}

.week{display:flex;gap:6px;margin:18px 0 2px;flex:none}
#view-home>*{flex:none}
.day{
  flex:1;height:58px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  border-radius:13px;transition:.2s
}
.day i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.06em;opacity:.45;line-height:1.1}
.day b{font-size:12px;font-weight:850;letter-spacing:-.01em;line-height:1.1}
.day .pt{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;transition:.2s;flex:none}
.day.has .pt{opacity:.55}
[data-theme="candy"] .day{background:#fff;border:1.5px solid #231F1C;box-shadow:2px 2px 0 #FFD23F}
[data-theme="candy"] .day.today{background:#FF7A59;color:#fff;box-shadow:2px 2px 0 #231F1C}
[data-theme="candy"] .day.today i{opacity:.85}
[data-theme="candy"] .day.today .pt{background:#fff;opacity:1}
[data-theme="aurora"] .day{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
[data-theme="aurora"] .day.today{background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#070c1e;border-color:transparent;box-shadow:0 6px 18px -8px rgba(34,211,238,.9)}
[data-theme="aurora"] .day.today i{opacity:.7}
[data-theme="aurora"] .day.today .pt{background:#070c1e;opacity:.7}

.stats{display:flex;margin:17px 2px 0}
.stat{flex:1;min-width:0}
.stat b{display:block;font-size:15.5px;font-weight:850;letter-spacing:-.015em;line-height:1.2}
.stat span{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.45}
.stat + .stat{border-left:1px solid rgba(0,0,0,.1);padding-left:15px;margin-left:15px}
[data-theme="aurora"] .stat + .stat{border-left-color:rgba(255,255,255,.15)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}
.sec-title{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}

.list{display:flex;flex-direction:column;gap:9px}
.item{
  display:flex;align-items:center;gap:11px;
  padding:12px 13px;border-radius:16px;
  transition:transform .15s ease
}
.item:active{transform:scale(.985)}
.item-ic{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:grid;place-items:center;font-size:11.5px;font-weight:850
}
.item-t{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.item-t b{font-size:13px;font-weight:700;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t span{font-size:10.5px;opacity:.55}
.item-d{font-size:10.5px;font-weight:850;flex:none;white-space:nowrap}
.item.done{opacity:.45}
.item.done .item-t b{text-decoration:line-through}

.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{
  font-size:11px;padding:8px 13px;display:flex;align-items:center;gap:6px;
  transition:transform .12s
}
.chip:active{transform:scale(.95)}

.hero-empty{
  border-radius:22px;padding:22px 18px;text-align:center;font-size:12.5px;line-height:1.7;opacity:.75
}

/* ================= 对话 ================= */
#view-chat{padding-bottom:8px;display:flex;flex-direction:column}
#view-chat .msg:first-child{margin-top:auto}
.msg{display:flex;gap:9px;margin-bottom:14px;align-items:flex-end}
.msg .mini{
  width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:850;overflow:hidden
}
.msg .mini img{width:100%;height:100%;object-fit:cover}
.bubble{
  max-width:76%;padding:11px 14px;font-size:12.8px;line-height:1.66;
  letter-spacing:.005em;word-break:break-word;white-space:pre-wrap
}
.msg.u{flex-direction:row-reverse}
.bubble-u{max-width:76%;padding:11px 14px;font-size:12.8px;line-height:1.66;word-break:break-word}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:.9}}

[data-theme="aurora"] .msg .mini{background:linear-gradient(140deg,#a78bfa,#22d3ee);color:#070d20}
[data-theme="candy"] .msg .mini{background:#FFD23F;color:#231F1C}

/* ================= 记事本 ================= */
.note-group{margin-bottom:18px}
.note-head{
  display:flex;align-items:center;gap:8px;margin:0 2px 9px;
  font-size:10.5px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;opacity:.55
}
.note-head em{font-style:normal;opacity:.7;letter-spacing:0;font-weight:700}
.note-item{
  display:flex;align-items:flex-start;gap:11px;padding:13px;border-radius:16px;margin-bottom:8px;
  transition:transform .15s
}
[data-theme="candy"] .note-item{
  background:#fff;border:2px solid #231F1C;box-shadow:3.5px 3.5px 0 #FFD23F
}
[data-theme="candy"] .note-item.done{box-shadow:3.5px 3.5px 0 #E7E0D2;background:#FBFAF7}
[data-theme="aurora"] .note-item{
  background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.1)
}
.note-foot{
  text-align:center;font-size:10px;opacity:.35;padding:14px 0 26px;line-height:1.7
}
.note-item:active{transform:scale(.985)}
.check{
  width:20px;height:20px;border-radius:50%;flex:none;margin-top:1px;
  display:grid;place-items:center;font-size:11px;font-weight:900;
  border:2px solid currentColor;opacity:.5;transition:.18s
}
.note-item.done .check{opacity:1;background:currentColor;color:transparent}
.note-item.done .check::after{content:"✓";color:#fff;font-size:11px}
.note-item.done .note-t b{text-decoration:line-through;opacity:.55}
.note-t{flex:1;min-width:0}
.note-t b{font-size:13px;font-weight:700;display:block;line-height:1.35}
.note-t p{font-size:10.8px;opacity:.55;margin-top:3px;line-height:1.5}
.note-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.note-d{font-size:10px;font-weight:850;white-space:nowrap}
.tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;border:1.5px solid currentColor;opacity:.6}
.empty{text-align:center;font-size:12px;padding:40px 20px;line-height:1.8}

/* ================= 输入区 ================= */
.composer{
  position:relative;z-index:6;flex:none;
  padding:8px 16px 10px;display:none
}
.composer.on{display:block}
.composer-in{
  display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px
}
.composer-in textarea{
  flex:1;font-size:12.8px;line-height:1.5;resize:none;max-height:84px;
  padding:6px 0;background:transparent
}
.composer-in textarea::placeholder{opacity:.42}
.mini-btn{
  width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;font-size:15px;opacity:.55
}
.send{
  width:32px;height:32px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:900;transition:transform .12s
}
.send:active{transform:scale(.9)}

/* ================= 底栏 ================= */
.tabbar{
  position:relative;z-index:7;flex:none;
  display:flex;align-items:center;
  padding:9px 8px calc(9px + var(--safe-b));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10px;font-weight:750;letter-spacing:.02em;
  padding:3px 0;transition:color .2s
}
.tab .dot{
  width:20px;height:20px;border-radius:7px;display:grid;place-items:center;
  background:transparent;transition:.2s
}
.tab .dot svg{width:13px;height:13px}
.tab.on .dot{transform:translateY(-1px)}

/* ================= 弹层 ================= */
.mask{
  position:absolute;inset:0;z-index:20;
  background:rgba(15,14,22,.42);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s
}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:21;
  padding:18px 20px calc(22px + var(--safe-b));
  transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.9,.25,1);
  max-height:88%;overflow-y:auto
}
.sheet.on{transform:none}
.sheet-handle{
  width:38px;height:4px;border-radius:99px;background:currentColor;opacity:.2;
  margin:0 auto 16px
}
.sheet h3{font-size:16px;font-weight:850;margin-bottom:4px}
.sheet-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;opacity:.45;transition:.15s}
.sheet-close:active{transform:scale(.9)}
.sheet .desc{font-size:11.5px;opacity:.55;margin-bottom:18px;line-height:1.6}
.pair{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field{
  width:100%;padding:11px 13px;font-size:13px;border-radius:13px;
  color:inherit;font-weight:600
}
.field::placeholder{opacity:.4;font-weight:400}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.sec-title2{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin:0 0 9px 2px}
.ava-grid{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.ava-opt{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;

}
.ava-opt.on{border-color:currentColor;transform:scale(1.06)}
.ava-opt img{width:100%;height:100%;object-fit:cover}
.theme-row{display:flex;gap:11px;margin-bottom:16px}
.theme-card{
  flex:1;padding:9px;border-radius:16px;position:relative;
  display:flex;flex-direction:column;gap:8px;
  transition:.18s;cursor:pointer
}
.theme-card.on{transform:translateY(-2px)}
.theme-prev{
  height:62px;border-radius:11px;position:relative;overflow:hidden;flex:none
}
.tp-candy{background:linear-gradient(160deg,#FFF4E2,#FFE8F1 50%,#E7F7F3);display:flex;align-items:center;justify-content:center}
.tp-candy span{width:70%;height:22px;background:#fff;border:1.5px solid #231F1C;border-radius:6px;box-shadow:2px 2px 0 #FF7A59;display:block}
.tp-aurora{background:radial-gradient(120% 100% at 20% 0%,#7c3aed,#0b0e28 60%,#070a1c);display:flex;align-items:center;justify-content:center}
.tp-aurora span{width:70%;height:22px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:6px;display:block}
.theme-card b{font-size:11.5px;font-weight:800}
.theme-card small{font-size:9.5px;opacity:.5;display:block;margin-top:1px}
.btn-main{
  width:100%;padding:13px;font-size:13.5px;font-weight:850;letter-spacing:.01em;
  margin-top:6px
}
.kinds{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.kind{padding:8px 13px;border-radius:10px;font-size:12px;font-weight:750;transition:.15s}
.kind:active{transform:scale(.95)}
[data-theme="candy"] .kind{background:#fff;border:2px solid #231F1C;box-shadow:2px 2px 0 #E7E0D2}
[data-theme="candy"] .kind.on{background:#FF7A59;color:#fff;box-shadow:2px 2px 0 #231F1C}
[data-theme="aurora"] .kind{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8)}
[data-theme="aurora"] .kind.on{background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#070c1e;border-color:transparent}
.btn-ghost{
  width:100%;padding:11px;font-size:12px;font-weight:700;opacity:.6;margin-top:4px
}
.toast{
  position:absolute;left:50%;bottom:110px;transform:translate(-50%,10px);
  background:rgba(20,18,28,.9);color:#fff;font-size:11.5px;font-weight:600;
  padding:9px 16px;border-radius:99px;z-index:30;opacity:0;pointer-events:none;
  transition:.25s;white-space:nowrap
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= 图片入口弹层 ================= */
.picker{
  position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(15,14,22,.44);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .22s;padding:0 0 20px
}
.picker.on{opacity:1;pointer-events:auto}
.pk-card{
  width:min(342px, calc(100% - 32px));border-radius:22px;overflow:hidden;
  display:flex;flex-direction:column;
  transform:translateY(16px);transition:transform .26s cubic-bezier(.2,.9,.25,1)
}
.picker.on .pk-card{transform:none}
.pk-title{font-size:10.5px;font-weight:800;letter-spacing:.08em;opacity:.42;padding:16px 18px 8px}
.pk-item{
  display:flex;align-items:center;gap:12px;padding:12px 18px;text-align:left;
  width:100%;transition:background .15s
}
.pk-item svg{width:22px;height:22px;flex:none;opacity:.72}
.pk-item span{display:flex;flex-direction:column;gap:2px;min-width:0}
.pk-item b{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.pk-item em{font-style:normal;font-size:10px;opacity:.45;line-height:1.4}
.pk-cancel{
  margin-top:4px;padding:14px;font-size:12.5px;font-weight:750;width:100%;
  border-top:1px solid rgba(128,128,140,.18)
}
[data-theme="candy"] .pk-card{
  background:#FFF9F0;border:2.5px solid #231F1C;
  box-shadow:0 24px 60px -22px rgba(35,31,28,.55)
}
[data-theme="candy"] .pk-item:active{background:#FFEFE2}
[data-theme="candy"] .pk-cancel{color:#E0552F}
[data-theme="aurora"] .pk-card{
  background:#0c0f2e;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 28px 70px -22px rgba(0,0,0,.95)
}
[data-theme="aurora"] .pk-item:active{background:rgba(255,255,255,.07)}
[data-theme="aurora"] .pk-cancel{color:#7dd3fc}

/* ================= 识别结果确认卡 ================= */
.cc{max-width:88%;display:flex;flex-direction:column;overflow:hidden;flex:none}
.cc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:11px 14px 9px}
.cc-head b{font-size:11.5px;font-weight:800}
.cc-head span{font-size:9.5px;font-weight:700;opacity:.42}
.cc-list{display:flex;flex-direction:column}
.cc-it{padding:9px 14px;display:flex;gap:9px;align-items:flex-start}
.cc-it i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.32;margin-top:6px;flex:none}
.cc-it div{min-width:0;flex:1}
.cc-it b{display:block;font-size:12px;font-weight:750;line-height:1.35}
.cc-it span{display:block;font-size:10px;opacity:.5;margin-top:2px;line-height:1.4}
.cc-ops{display:flex;gap:8px;padding:9px 12px 12px}
.cc-ops button{flex:1;padding:9px;border-radius:9px;font-size:11.5px;font-weight:800;transition:.15s}
.cc-ops button:active{transform:scale(.97)}
[data-theme="candy"] .cc{
  background:#fff;border:2px solid #231F1C;border-radius:16px;box-shadow:3px 3px 0 #FFD23F
}
[data-theme="candy"] .cc-it + .cc-it{border-top:1px dashed rgba(35,31,28,.15)}
[data-theme="candy"] .cc-ops .ok{background:#FF7A59;color:#fff;border:2px solid #231F1C}
[data-theme="candy"] .cc-ops .no{background:#fff;border:2px solid #231F1C}
[data-theme="aurora"] .cc{
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.16);border-radius:16px
}
[data-theme="aurora"] .cc-it + .cc-it{border-top:1px solid rgba(255,255,255,.1)}
[data-theme="aurora"] .cc-ops .ok{background:linear-gradient(135deg,#a78bfa,#22d3ee);color:#070c1e}
[data-theme="aurora"] .cc-ops .no{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}

/* 图片消息 */
.bubble-img{padding:5px !important;overflow:hidden;line-height:0}
.bubble-img img{display:block;width:100%;max-width:186px;border-radius:11px}
.msg .mini.loading{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* ================= 桌面端专属元素（默认隐藏） ================= */
.weekboard,.pghead{display:none}
.hero-main{display:block}
.hero-big{display:none}

========================================================= */

  }

  .sb-who{display:flex;flex-direction:column;gap:2px;min-width:0}

  .cp-foot{padding:8px 13px 15px;flex:none}
  .cp-foot .composer-in{padding:7px 7px 7px 13px}

  .cp-sug button{
    font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:99px;

  }

  /* ---------- 中栏内容 ---------- */
  .views{flex:1;min-height:0}

  .pghead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}

  /* 主卡放大 */

  /* 周历格子 */

}

@media (min-width:880px) and (max-width:1199px){

  .weekboard{display:none}
  .week{display:flex}
}

<script>
(function(){
"use strict";

/* ================= 数据层 ================= */
const KEY = "campus-assistant-v1";
const DEF = {
  profile: { name:"小助理", call:"总裁", theme:"candy", city:"", avatar:{type:"glyph", glyph:"助", color:0, img:null} },
  records: [],
  chats: [],
  seeded: false
};
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEF));
    const d = JSON.parse(raw);
    return Object.assign(JSON.parse(JSON.stringify(DEF)), d, {
      profile: Object.assign({}, DEF.profile, d.profile||{}, {
        avatar: Object.assign({}, DEF.profile.avatar, (d.profile||{}).avatar||{})
      })
    });
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); return; }
  catch(e){ /* 配额满了：逐步丢掉最老的截图，先保住文字记录 */ }
  for(const m of db.chats){
    if(!m.img) continue;
    m.img = null;
    try{ localStorage.setItem(KEY, JSON.stringify(db)); return; }catch(e2){}
  }
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const DAY = 86400000;
const uid = () => Math.random().toString(36).slice(2,9);

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayDiff(ts){
  if(!ts) return null;
  return Math.round((startOfDay(new Date(ts)) - startOfDay(new Date()))/DAY);
}
function fmtDue(ts){
  if(!ts) return "时间待补";
  const d = new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function dueLabel(ts){
  if(!ts) return {text:"待补时间", soon:false};
  const n = dayDiff(ts);
  if(n < 0)  return {text:`逾期 ${-n} 天`, soon:true};
  if(n === 0) return {text:"今天", soon:true};
  if(n === 1) return {text:"明天", soon:true};
  return {text:`${n} 天`, soon:n <= 3};
}
function greetWord(){
  const h = new Date().getHours();
  if(h < 5)  return "还没睡呀";
  if(h < 9)  return "早上好";
  if(h < 12) return "上午好";
  if(h < 14) return "中午好";
  if(h < 18) return "下午好";
  if(h < 23) return "晚上好";
  return "夜深了";
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("on"), 1900);
}
function toLocalInput(ts){
  const d = new Date(ts || Date.now());
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ================= 头像 ================= */
const AVA_COLORS = [
  ["#FFD23F","#231F1C"], ["#FF7A59","#fff"], ["#4ECDC4","#08302C"],
  ["#A78BFA","#0B0620"], ["#FFB4C8","#3A1220"], ["#8FD3F4","#0A2A3A"]
];
function avatarHTML(){
  const a = db.profile.avatar;
  const th = document.documentElement.dataset.theme;
  if(a.type === "img" && a.img) return `<img src="${a.img}" alt="">`;
  if(th === "aurora") return `<span>${escapeHTML(a.glyph||"助")}</span>`;
  const c = AVA_COLORS[a.color % AVA_COLORS.length];
  return `<span style="color:${c[1]}">${escapeHTML(a.glyph||"助")}</span>`;
}
function applyAvatar(){
  const a = db.profile.avatar;
  const th = document.documentElement.dataset.theme;
  const html = avatarHTML();
  document.querySelectorAll(".js-ava").forEach(el=>{
    el.innerHTML = html;
    if(a.type === "img" && a.img) el.style.background = "transparent";
    else if(th === "aurora") el.style.background = "";
    else el.style.background = AVA_COLORS[a.color % AVA_COLORS.length][0];
  });
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ================= 自然语言解析 ================= */
const KIND_MAP = [
  {k:"竞赛", re:/(竞赛|比赛|大赛|杯|赛|建模|挑战赛|初赛|复赛|决赛)/},
  {k:"考试", re:/(考试|期末|期中|四级|六级|考研|测验|补考|机考)/},
  {k:"作业", re:/(作业|报告|论文|实验|课设|大作业|习题|pre|展示)/i},
  {k:"活动", re:/(讲座|活动|会议|例会|班会|宣讲|报名)/}
];
const WEEK = {"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0,"天":0};
const CN_NUM = {"零":0,"一":1,"二":2,"两":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
function cnHour(str){
  if(/^\d+$/.test(str)) return parseInt(str,10);
  if(str === "十") return 10;
  if(str.length === 2 && str[1] === "十") return (CN_NUM[str[0]]||0) * 10;
  if(str[0] === "十") return 10 + (CN_NUM[str[1]]||0);
  if(str.length === 3 && str[1] === "十") return (CN_NUM[str[0]]||0) * 10 + (CN_NUM[str[2]]||0);
  return CN_NUM[str] !== undefined ? CN_NUM[str] : null;
}

function parseText(raw){
  const now = new Date();
  let s = " " + raw + " ";
  let base = null, hour = 23, min = 59, hasTime = false, hasDate = false;
  const cut = [];

  // ---- 时间 ----
  const tRe = /(上午|早上|早晨|中午|下午|晚上|傍晚|凌晨)?\s*(\d{1,2}|[零一二两三四五六七八九十]{1,3})\s*(?:[:：点时])\s*(\d{1,2})?\s*分?/;
  const tm = s.match(tRe);
  if(tm){
    let h = cnHour(tm[2]);
    const mi = tm[3] ? parseInt(tm[3],10) : 0;
    const p = tm[1] || "";
    if(h !== null){
      if((p==="下午"||p==="晚上"||p==="傍晚") && h < 12) h += 12;
      if(p==="中午" && h < 11) h += 12;
      if(p==="凌晨" && h === 12) h = 0;
      if(h >= 0 && h <= 23 && mi >= 0 && mi <= 59){
        hour = h; min = mi; hasTime = true;
        cut.push(tm[0]);
      }
    }
  }

  // ---- 日期 ----
  const ymd = s.match(/(\d{4})\s*[-\/年]\s*(\d{1,2})\s*[-\/月]\s*(\d{1,2})\s*[日号]?/);
  if(ymd){
    base = new Date(+ymd[1], +ymd[2]-1, +ymd[3]); hasDate = true; cut.push(ymd[0]);
  }
  if(!base){
    const md = s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
    if(md){
      let y = now.getFullYear();
      let d = new Date(y, +md[1]-1, +md[2]);
      if(startOfDay(d) < startOfDay(now)) d = new Date(y+1, +md[1]-1, +md[2]);
      base = d; hasDate = true; cut.push(md[0]);
    }
  }
  if(!base){
    const sl = s.match(/(\d{1,2})\s*[\/]\s*(\d{1,2})\s*[日号]?/);
    if(sl && +sl[1] <= 12 && +sl[2] <= 31){
      let y = now.getFullYear();
      let d = new Date(y, +sl[1]-1, +sl[2]);
      if(startOfDay(d) < startOfDay(now)) d = new Date(y+1, +sl[1]-1, +sl[2]);
      base = d; hasDate = true; cut.push(sl[0]);
    }
  }
  if(!base){
    const rel = [[/大后天/,3],[/后天/,2],[/明天|明日/,1],[/今天|今日|今晚/,0]];
    for(const [re,n] of rel){
      if(re.test(s)){
        const d = new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate()+n);
        base = d; hasDate = true; cut.push(s.match(re)[0]); break;
      }
    }
  }
  if(!base){
    const nd = s.match(/(\d{1,2})\s*天\s*[后内]/);
    if(nd){
      const d = new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate()+ +nd[1]);
      base = d; hasDate = true; cut.push(nd[0]);
    }
  }
  if(!base){
    const wkOnly = s.match(/(下下|下|本|这)\s*周(?!\s*[一二三四五六日天])/);
    if(wkOnly){
      const d = startOfDay(new Date());
      const delta = (7 - d.getDay()) % 7;
      d.setDate(d.getDate() + delta + (wkOnly[1] === "下" ? 7 : wkOnly[1] === "下下" ? 14 : 0));
      base = d; hasDate = true; cut.push(wkOnly[0]);
    }
  }
  if(!base){
    const wk = s.match(/(下下|下|本|这)?\s*(?:周|星期)\s*([一二三四五六日天])/);
    if(wk){
      const target = WEEK[wk[2]];
      const d = startOfDay(new Date());
      const cur = d.getDay();
      let diff = (target - cur + 7) % 7;
      if(wk[1] === "下")      diff = diff === 0 ? 7 : diff + 7;
      else if(wk[1] === "下下") diff = (diff === 0 ? 7 : diff) + 14;
      else if(diff === 0)      diff = 7;
      d.setDate(d.getDate() + diff);
      base = d; hasDate = true; cut.push(wk[0]);
    }
  }

  // ---- 标题 ----
  let title = s;
  cut.forEach(c => { title = title.split(c).join(" "); });
  title = title
    .replace(/^\s*(帮我|帮忙|麻烦|请|记得|提醒我|提示我|记录一下|记一下|记录|备忘|新任务|记下|我有个|有一个)+/g," ")
    .replace(/(截止时间|截止日期|截止|ddl|DDL|要交|提交时间|之前|以前|前)/g," ")
    .replace(/[，,。;；!！?？~、\s]+/g," ")
    .trim();

  // 类别
  let kind = "其他";
  for(const k of KIND_MAP){ if(k.re.test(title + raw)){ kind = k.k; break; } }

  let due = null;
  if(hasDate){
    const d = base ? new Date(base) : new Date(now);
    d.setHours(hour, min, 0, 0);
    due = d.getTime();
  }
  return { title: title || "未命名事项", due, kind, hasTime, hasDate };
}

function visionPrompt(){
  const t = new Date();
  const wl = ["日","一","二","三","四","五","六"];
  const today = `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;

请从这张图片里找出所有带时间的信息，只输出严格 JSON 数组，不要解释、不要 markdown 代码块。

数组每一项的字段：

只输出 JSON 数组。`;

function qwenError(code, msg){
  const c = String(code || "");
  if(c.indexOf("access_denied") >= 0) return "识别服务拒绝了这次请求（密钥没有该模型的权限）。";
  if(c.indexOf("invalid_api_key") >= 0 || c === "401") return "识别密钥无效，需要更新。";
  if(c.indexOf("model_not_found") >= 0) return "识别模型不可用，需要换一个模型名。";
  if(c.indexOf("throttling") >= 0 || c === "429") return "请求太频繁了，缓十几秒再试。";
  if(c === "AbortError") return "识别超时了，网络有点慢，再试一次？";
  return "识别没成功：" + (msg || c || "未知错误");
}

function parseVisionJSON(text){
  let s = String(text || "").trim()
    .replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
  const a = s.indexOf("["), b = s.lastIndexOf("]");
  if(a >= 0 && b > a) s = s.slice(a, b + 1);
  let arr;
  try{ arr = JSON.parse(s); }
  catch(e){ throw new Error("识别结果没读懂，换一张更清楚的截图试试。"); }
  if(!Array.isArray(arr)) throw new Error("识别结果格式不对，重试一次？");

  const OK = ["作业","竞赛","考试","活动","其他"];
  return arr.slice(0, 8).map(it => {
    it = it || {};
    const raw = String(it.raw_time || "").trim();
    const p = raw ? parseText(raw) : { due: null };
    const due = p.due || null;
    let kind = OK.indexOf(it.kind) >= 0 ? it.kind : (p.kind || "其他");
    const title = String(it.title || "").trim() || "未命名事项";
    const dueText = due
      ? fmtDue(due)
      : (raw ? raw + "（时间没认准，可手动改）" : "时间待补");
    return { title, due, kind, note: String(it.note || "").trim(), raw, dueText };
  });
}

async function qwenRecognize(dataUrl){
  const body = {
    model: QWEN.model,
    messages: [{
      role: "user",
      content: [
        { type: "image_url", image_url: { url: dataUrl } },
        { type: "text", text: visionPrompt() }
      ]
    }],
    max_tokens: 1200,
    temperature: 0.1
  };

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  let res;
  try{
    res = await fetch(QWEN.endpoint, {
      method: "POST",
      headers: { "Authorization": "Bearer " + QWEN.key, "Content-Type": "application/json" },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  }catch(err){
    clearTimeout(timer);
    if(err && err.name === "AbortError") throw new Error("识别超时了（45 秒没返回），网络慢或者图太大，再试一次？");
    throw new Error("连不上识别服务，检查一下网络？");
  }
  clearTimeout(timer);

  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok || data.error){
    throw new Error(qwenError((data.error && (data.error.code || data.error.type)) || res.status, data.error && data.error.message));
  }
  const txt = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  return parseVisionJSON(txt);
}

/* 图片压缩：拍照原图动辄几 MB，先缩到能接受的大小 */
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      }catch(err){ reject(err); }
      finally{ URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}

function addRecord(p){
  const r = { id:uid(), title:p.title, due:p.due, kind:p.kind || "其他", note:p.note||"", done:false, createdAt:Date.now() };
  db.records.push(r); save();

}
function upcoming(){
  return db.records.filter(r => !r.done)
    .sort((a,b) => (a.due||9e15) - (b.due||9e15));
}
function nearest(){
  const u = upcoming().filter(r => r.due && r.due > Date.now() - DAY);
  return u[0] || upcoming()[0] || null;
}

function renderNote(){
  const all = db.records.slice();
  const groups = [
    { key:"over", name:"已逾期", items:[] },
    { key:"today", name:"今天", items:[] },
    { key:"week", name:"7 天内", items:[] },
    { key:"later", name:"以后", items:[] },
    { key:"undated", name:"时间待补", items:[] },
    { key:"done", name:"已完成", items:[] }
  ];
  all.forEach(r => {
    if(r.done) return groups[5].items.push(r);
    if(!r.due) return groups[4].items.push(r);
    const n = dayDiff(r.due);
    if(n < 0) groups[0].items.push(r);
    else if(n === 0) groups[1].items.push(r);
    else if(n <= 7) groups[2].items.push(r);
    else groups[3].items.push(r);
  });
  groups.forEach(g => {
    if(g.key !== "done") g.items.sort((a,b)=>(a.due||9e15)-(b.due||9e15));
    else g.items.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  });

  const total = db.records.filter(r=>!r.done).length;
  let html = `<div class="pghead"><h1>记事本</h1><p>${total} 项待办</p></div>
    <div class="sec" style="margin-top:4px">
      <span class="sec-title">记事本</span>
      <span class="sec-title">${total} 项待办</span>
    </div>`;

  const shown = groups.filter(g => g.items.length);
  if(!shown.length){
    html += `<div class="empty">记事本还是空的。<br>去首页把通知丢给小助理吧。</div>`;
  }
  shown.forEach(g => {
    html += `<div class="note-group">
      <div class="note-head">${g.name}<em>${g.items.length}</em></div>
      ${g.items.map(r => `
        <div class="note-item ${r.done?'done':''}" data-open="${r.id}">
          <div class="check" data-toggle="${r.id}"></div>
          <div class="note-t">
            <b>${escapeHTML(r.title)}</b>
            <p>${r.due ? fmtDue(r.due) : "还没定时间"}${r.note ? " · " + escapeHTML(r.note) : ""}</p>
          </div>
          <div class="note-r">
            <span class="note-d">${r.done ? "已完成" : dueLabel(r.due).text}</span>
            <span class="tag">${r.kind||"其他"}</span>
          </div>
        </div>`).join("")}
    </div>`;
  });
  if(shown.length) html += `<div class="note-foot">点条目可改时间 / 删除 · 点圆圈直接划掉</div>`;
  $("#view-note").innerHTML = html;
}

/* 本地规则引擎：网络异常或模型不可用时的兜底 */
function replyLocal(text){
  const t = text.trim();
  const call = db.profile.call || "总裁";

  // 设置类
  if(/^(改名|名字)/.test(t)){ return `总裁想把我叫什么？点右上角「⋯」进去改，改完我就是新名字了。`; }

  // 完成
  const doneM = t.match(/^(?:我)?(?:已经)?(?:做完了?|完成了?|交了|搞定了?)\s*(.*)$/);
  if(doneM){
    const kw = doneM[1].trim();
    const hit = db.records.filter(r => !r.done && (!kw || r.title.includes(kw)));
    if(hit.length === 1){
      hit[0].done = true; hit[0].doneAt = Date.now(); save(); renderHome(); renderNote();
      return `好，${call}。「${hit[0].title}」已经划掉了。还剩 ${db.records.filter(r=>!r.done).length} 项。`;
    }
    if(hit.length > 1){
      return `有 ${hit.length} 项对得上：${hit.map(r=>`「${r.title}」`).join("、")}。要划掉哪一个？`;
    }
  }

  // 查询
  const askNear = /(最近|接下来|有什么|哪些|截止|要交|ddl|deadline|催|还有)/i.test(t);
  const askWeek = /(这周|本周|一周|七天)/.test(t);
  const askNote = /(记事本|清单|全部|所有|列表)/.test(t);

  if(askNote && !askNear){
    const u = upcoming();
    if(!u.length) return `记事本现在是空的，${call}。`;
    return `记事本里有 ${u.length} 项待办：\n` + u.slice(0,6).map((r,i)=>{
      const d = dueLabel(r.due);
      return `${i+1}. ${r.title} — ${fmtDue(r.due)}（${d.text}）`;
    }).join("\n") + (u.length>6 ? `\n…还有 ${u.length-6} 项，去记事本看。` : "");
  }

  if(askNear){
    let pool = upcoming();
    if(askWeek){
      pool = pool.filter(r => r.due && dayDiff(r.due) <= 7);
      if(!pool.length) return `这周没有要交的东西，${call}可以松口气。`;
      return `${call}，这周有 ${pool.length} 件事：\n` + pool.map((r,i)=>{
        return `${i+1}. ${r.title} — ${fmtDue(r.due)}（${dueLabel(r.due).text}）`;
      }).join("\n");
    }
    if(!pool.length) return `目前没有待办，${call}。有新通知丢给我就行。`;
    const top = pool[0], d = dueLabel(top.due);
    const rest = pool.slice(1,4);
    let out = `${call}，最近的是「${top.title}」，${fmtDue(top.due)} 截止（${d.text}）。`;
    if(rest.length) out += `\n后面还有：\n` + rest.map(r=>`· ${r.title} — ${dueLabel(r.due).text}`).join("\n");
    return out;
  }

  // 录入
  const p = parseText(t);

  // 兜底也不要把问候/提问记成待办
  if(isDateTimeQuestion(t)) return dateTimeAnswer();
  if(looksLikeQuestion(t) && !p.due){
    return `我在的，${call}。想记事情就带上时间，比如「11月15日 23:59 建模报名」；想问什么也直接说。`;
  }
  if(p.title.length < 2 && !p.hasDate){
    return `我在听，${call}。你可以说「11月15日 23:59 数学建模国赛报名」这种，也可以把通知截图发我。`;
  }
  const r = addRecord(p);
  renderHome(); renderNote();

  if(!r.due){
    return `记下了「${r.title}」，但没听出截止时间。补一个给我？比如「${r.title} 11月20日 18点」。`;
  }
  const dl = dueLabel(r.due);
  const phrase = dl.text === "今天" ? "就是今天"
    : dl.text === "明天" ? "明天就截止"
    : dl.text.indexOf("逾期") === 0 ? dl.text
    : `还有 ${dl.text}`;
  const warn = dl.soon ? "  时间有点紧，要不要现在就排个计划？" : "";
  return `记好了，${call}。\n「${r.title}」— ${fmtDue(r.due)}，${phrase}${r.kind !== "其他" ? " · " + r.kind : ""}。${warn}`;
}

【判断意图】只输出一个 JSON 对象，不要代码块、不要任何解释：
{"intent":"...","reply":"...","items":[],"done_indexes":[],"city":""}

intent 取值：
- record：用户给出需要记录的截止信息（作业 / 竞赛 / 考试 / 活动）
- query：用户在问自己的事（最近有什么、这周几件、某门课有什么）

- weather：问天气

【示例】照这个感觉判断：
"明天晚上8点交数据结构实验报告" → record
"数学建模国赛报名做完了" → complete
"最近有什么要交的" → query
"这周有几件事" → query
"今天星期几" → chat
"你是谁" → chat
"你好" → chat
"杭州天气怎么样" → weather

【判断顺序】严格按这个顺序走：
1. 句子里有未来的时间（明天 / 后天 / 今晚 / 下周 / 11月15日 / 晚上8点 / 3天后 等），
   并且是在说一件要做的事 → record
2. 说"做完了 / 交了 / 提交了 / 搞定了 / 划掉"，而且没有未来时间 → complete
3. 是疑问句（带 ？ / 吗 / 呢 / 什么 / 谁 / 怎么 / 几点 / 多少 / 哪）→ query（问自己的待办）或 chat（问别的）
4. 问天气 → weather
5. 其余 → chat

特别注意（容易错的）：
- "明天晚上8点交数据结构实验报告" 是 record，因为有未来时间，是要做的事，不是已完成。
- "数据结构实验报告我交了" 才是 complete。
- "你是谁""你好""在吗""今天星期几" 这种没有具体事项的，一律 chat，items 留空。
- 拿不准的时候用 chat，不要往 record 上靠。宁可不记，也不要记错。

reply 写什么：
- 中文口语，短，最多 4 行，不要用 markdown 符号。
- query / chat / weather 必须把答案直接写在 reply 里。
- query 只能依据【记事本快照】回答，快照里没有就说没有，绝不编造事项或时间。
- chat 里被问到现在几点、今天几号、星期几，直接用【现在】里的信息回答。
- 不知道就直说不知道，不要编。
- record / complete 的 reply 只写一句轻轻确认，不要自己写具体日期时间，系统会补。

其它字段：
- items：intent=record 时填写，每项 {"title","raw_time","kind","note"}。
  title 是事项简称，20 字内；raw_time 原样抄用户说的时间（如"11月15日 23:59""明天晚上8点"），
  用户没给时间就留空字符串；kind 取 作业/竞赛/考试/活动/其他 之一；note 是地点、材料等补充，可空。
  一句话里有多件事就拆成多条。
- done_indexes：intent=complete 时，填【记事本快照】里对应条目的编号（数字数组）。
- city：intent=weather 时填城市名；用户没说、你也不知道就留空字符串。`
  + (hint ? `\n\n【补充要求】${hint}` : "");
}

function extractJSON(s){
  s = String(s || "").replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if(a < 0 || b <= a) return null;
  try{ return JSON.parse(s.slice(a, b + 1)); }catch(e){ return null; }
}

async function callQwen(model, text, hint){
  const list = snapshotList();
  const hist = db.chats.slice(-9, -1)
    .filter(m => m.text)
    .map(m => ({ role: m.role === "a" ? "assistant" : "user", content: m.text }));

  const body = {
    model,
    messages: [
      { role:"system", content: buildSysPrompt(list, hint) },
      ...hist,
      { role:"user", content:text }
    ],
    temperature: 0.35,
    max_tokens: 700
  };

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  let res;
  try{
    res = await fetch(QWEN.endpoint, {
      method:"POST",
      headers: { "Authorization":"Bearer " + QWEN.key, "Content-Type":"application/json" },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  }catch(e){ clearTimeout(timer); throw e; }
  clearTimeout(timer);

  const data = await res.json().catch(() => ({}));
  if(!res.ok || data.error) throw new Error("qwen-error");
  const ch = data.choices && data.choices[0] && data.choices[0].message;
  const obj = extractJSON(ch && ch.content);
  if(!obj) throw new Error("bad-json");
  lastSnapshot = list;
  return obj;
}

async function fetchWeather(city){
  for(let i = 0; i < 2; i++){
    try{ return await fetchWeatherOnce(city); }
    catch(e){ if(i === 1) throw e; }
  }
  return null;
}

async function fetchWeatherOnce(city){
  const g = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(city) + "&count=1&language=zh&format=json");
  const gj = await g.json();
  const loc = gj && gj.results && gj.results[0];
  if(!loc) return null;
  const q = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.latitude +
    "&longitude=" + loc.longitude +
    "&current=temperature_2m,weather_code,relative_humidity_2m" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&timezone=auto&forecast_days=1";
  const w = await fetch(q);
  const wj = await w.json();
  if(!wj || !wj.current) return null;
  return { name: loc.name, cur: wj.current, day: wj.daily || {} };
}

function weatherText(w){
  const call = db.profile.call || "总裁";
  const cur = w.cur || {}, day = w.day || {};
  const t = Math.round(cur.temperature_2m);
  const desc = WMO[cur.weather_code] || "天气";
  const max = day.temperature_2m_max ? Math.round(day.temperature_2m_max[0]) : t;
  const min = day.temperature_2m_min ? Math.round(day.temperature_2m_min[0]) : t;
  const pp = day.precipitation_probability_max ? Math.round(day.precipitation_probability_max[0]) : null;

  let l1 = `${call}，${w.name}现在 ${t}°，${desc}；今天 ${min}~${max}°`;
  if(pp !== null) l1 += `，降水概率 ${pp}%`;
  l1 += "。";

  let tip = "正常穿就行。";
  if(pp !== null && pp >= 60) tip = "记得带伞。";
  else if(t <= 8) tip = "有点冷，穿厚点。";
  else if(t >= 30) tip = "挺热，多喝水、注意防晒。";
  return l1 + "\n" + tip;
}

function normItem(it){
  it = it || {};
  const title = String(it.title || "").trim();
  if(!title) return null;
  const raw = String(it.raw_time || "").trim();
  const p = raw ? parseText(raw) : { due:null };
  const due = p.due || null;
  const OK = ["作业","竞赛","考试","活动","其他"];
  const kind = OK.indexOf(it.kind) >= 0 ? it.kind : (p.kind || "其他");
  const dueText = due ? fmtDue(due) : (raw ? raw + "（没认准时间）" : "时间待补");
  return { title, due, kind, note:String(it.note || "").trim(), dueText };
}

function looksLikeQuestion(t){
  t = String(t || "").trim();
  if(!t) return false;
  if(/[?？]/.test(t)) return true;
  if(/(吗|呢|吧)\s*$/.test(t)) return true;
  if(/^(你|您|这|那|什么|谁|怎么|为什么|几点|多少|哪|能|可以|是不是|有没有|在吗)/.test(t)) return true;
  // 短句里出现疑问词，也按提问处理（"今天星期几""现在有什么"）
  if(t.length <= 12 && /(什么|谁|怎么|为什么|多少|哪|多久|几)/.test(t)) return true;
  return false;
}

function hasExplicitTime(t){
  return /(\d{1,2}\s*[月\/\-]\s*\d{1,2})|(\d{1,2}\s*[:：点])|(\d+\s*天[后内])|(明天|后天|大后天|下周|下下|周[一二三四五六日天]|星期[一二三四五六日天]|月底|周末)/.test(t);
}
function isDateTimeQuestion(t){
  return /(几号|星期几|礼拜几|周几|几点|多少号|什么日子)/.test(t);
}
function dateTimeAnswer(){
  const t = new Date();
  const wl = ["日","一","二","三","四","五","六"];
  return `现在是 ${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日 星期${wl[t.getDay()]} ${pad(t.getHours())}:${pad(t.getMinutes())}。`;
}

async function applyIntent(d, raw){
  const call = db.profile.call || "总裁";
  const intent = String(d.intent || "");

  /* —— 归纳日程：写入记事本 —— */
  if(intent === "record"){
    const items = (Array.isArray(d.items) ? d.items : []).map(normItem).filter(Boolean);

    // 兜底：像提问/打招呼、又没抽出任何时间，就不要硬记成待办
    if(looksLikeQuestion(raw) && !items.some(it => it.due)){
      return `这个我拿不准，${call}是在问我，还是想让我记一件事？\n想记的话带上时间，比如「11月15日 23:59 建模报名」。`;
    }

    if(!items.length){
      return (d.reply || "").trim() || `这句我没听出截止时间，${call}说具体点？比如「11月15日 23:59 建模报名」。`;
    }
    items.forEach(it=>{
      db.records.push({
        id: uid(), title: it.title, due: it.due, kind: it.kind,
        note: it.note, done: false, createdAt: Date.now()
      });
    });
    save(); renderHome(); renderNote();

    const head = (d.reply || "").trim();
    const lines = items.map(it=>`「${it.title}」— ${it.dueText}`);
    const tight = items.some(it=> it.due && dayDiff(it.due) <= 1);
    return (head && head.length <= 30 ? head : `记好了，${call}。`) + "\n" + lines.join("\n") +
      (tight ? "\n时间有点紧，要不要现在排一下？" : "");
  }

  /* —— 完成 —— */
  if(intent === "complete"){
    const idx = Array.isArray(d.done_indexes) ? d.done_indexes : [];
    const hit = idx.map(i => lastSnapshot[i - 1]).filter(Boolean);
    if(!hit.length) return (d.reply || "").trim() || "哪一件做完了？说个名字我就划掉。";
    hit.forEach(r=>{ r.done = true; r.doneAt = Date.now(); });
    save(); renderHome(); renderNote();
    const left = db.records.filter(r=>!r.done).length;
    return `好，划掉了${hit.map(r=>`「${r.title}」`).join("、")}。还剩 ${left} 项。`;
  }

  /* —— 天气：取真实数据 —— */
  if(intent === "weather"){
    const city = String(d.city || "").trim() || db.profile.city || "";
    if(!city){
      awaitCity = true;
      return (d.reply || "").trim() || `查天气得知道城市——${call}你在哪座城市？`;
    }
    try{
      const w = await fetchWeather(city);
      if(!w){ awaitCity = true; return `没找到「${city}」这个地名，换个说法？`; }
      db.profile.city = city; save();
      return weatherText(w);
    }catch(e){
      return "天气服务没连上，过一会儿再问我？";
    }
  }

  /* —— 查日程 / 闲聊 —— */
  const r = (d.reply || "").trim();
  return r || "嗯，我在听。";
}

async function replySmart(text){
  const hasFutureTime = /(明天|后天|大后天|今天|今晚|明早|下周|下下|本周|这周|周[一二三四五六日天]|星期[一二三四五六日天]|\d{1,2}\s*月\s*\d{1,2}|\d{1,2}\s*[:：点]\s*\d{0,2}|\d+\s*天[后内]|月底|周末)/.test(text);
  const isQuestion = looksLikeQuestion(text);

  let d = null, err = null;
  try{ d = await callQwen(QWEN_TEXT.primary, text); }catch(e){ err = e; }

  // 兜底校验一：明明是"明天要交"，别当成已完成
  if(d && d.intent === "complete" && hasFutureTime){
    d = await retryWithHint(text,
      "这句里有未来的时间，用户是在交代一件要做的事，不是在说已经完成。请重新判断 intent。", d);
  }

  // 兜底校验二：明明是打招呼/提问，别当成要记录的事项
  if(d && d.intent === "record"){
    const noTime = !(Array.isArray(d.items) ? d.items : []).some(it => String((it || {}).raw_time || "").trim());
    if(isQuestion && noTime){
      d = await retryWithHint(text,
        "这更像一个提问或打招呼，不是要记录的事项。请重新判断 intent，不要往 record 上靠。", d);
    }
  }

  // 兜底校验三：问"今天星期几"这种，就算句子里带"今天"，也不能记成待办
  if(d && d.intent === "record" && isQuestion && (!hasExplicitTime(text) || isDateTimeQuestion(text))){
    const alt = await retryWithHint(text,
      "用户是在提问（问时间或问事情），不是要记录事项。请把 intent 设为 chat 或 query，并在 reply 里直接回答。", null);
    if(alt && alt.intent && alt.intent !== "record") d = alt;
    else if(isDateTimeQuestion(text)) return dateTimeAnswer();
    else return `我在的，${call}。想记事情就带上具体时间，比如「11月15日 23:59 建模报名」。`;
  }

  const okIntent = d && typeof d.intent === "string" && d.intent;
  const needReply = okIntent && ["query","chat","weather"].indexOf(d.intent) >= 0;
  const weak = !okIntent || (needReply && !String(d.reply || "").trim());

  if(weak){
    try{ d = await callQwen(QWEN_TEXT.strong, text); err = null; }catch(e2){ if(!err) err = e2; }
  }
  if(!d || !d.intent) throw err || new Error("llm-failed");
  return applyIntent(d, text);
}

async function retryWithHint(text, hint, fallback){
  try{
    const x = await callQwen(QWEN_TEXT.strong, text, hint);
    return x && x.intent ? x : fallback;
  }catch(e){ return fallback; }
}

async function send(text){
  const t = (text||"").trim();
  if(!t) return;
  hear(t);
  ["#input","#dInput"].forEach(sel=>{ const el=$(sel); if(el) el.value = ""; });
  autoGrow();
  typingOn();

  // 上一轮在问城市，这句就当城市名处理
  if(awaitCity){
    awaitCity = false;
    try{
      const w = await fetchWeather(t);
      if(w){ db.profile.city = t; save(); typingOff(); say(weatherText(w)); return; }
    }catch(e){}
  }

  try{
    const r = await replySmart(t);
    typingOff();
    say(r);
  }catch(e){
    typingOff();
    say(replyLocal(t));   // 网络或模型异常时退回本地规则
  }
}

/* ================= 图片识别流程 ================= */
async function handleImage(file){
  if(!file){ return; }
  if(!/^image\//.test(file.type || "")){ toast("只支持图片文件"); return; }
  if(!isDesktop() && curView !== "chat") go("chat");

  let full, thumb;
  try{
    full  = await compressImage(file, 1280, 0.82);
    thumb = await compressImage(file, 420, 0.6);
  }catch(e){
    say("这张图我打不开，换一张试试？");
    return;
  }

  db.chats.push({ role:"u", text:"", img:thumb, t:Date.now() });
  save(); renderChat();
  typingOn();

  try{
    const items = await qwenRecognize(full);
    typingOff();
    if(!items.length){
      say("这张图里没找到带时间的通知。要不你把截止时间那句话打给我？");
      return;
    }
    db.chats.push({ id:uid(), role:"a", type:"confirm", items, done:false, text:"", t:Date.now() });
    save(); renderChat();
  }catch(err){
    typingOff();
    say(err && err.message ? err.message : "识别失败了，再试一次？");
  }
}

function confirmItems(id){
  const m = db.chats.find(x => x.id === id);
  if(!m || m.done) return;
  const call = db.profile.call || "总裁";
  m.items.forEach(it => {
    db.records.push({
      id: uid(), title: it.title, due: it.due, kind: it.kind,
      note: it.note, done: false, createdAt: Date.now()
    });
  });
  m.done = true;
  m.text = `写好了，${call}。${m.items.length} 件事已经进记事本：\n` +
    m.items.map(it => `· ${it.title} — ${it.dueText}`).join("\n");
  save(); renderChat(); renderHome(); renderNote();
  toast("已写入记事本");
}

function discardItems(id){
  const m = db.chats.find(x => x.id === id);
  if(!m) return;
  m.done = true;
  m.text = "好，这张不记。想记的时候再发我。";
  save(); renderChat();
}

/* ================= 设置面板 ================= */
let draft = null;
function openSheet(){
  draft = JSON.parse(JSON.stringify(db.profile));
  $("#fName").value = draft.name;
  $("#fCall").value = draft.call;
  paintAvatars();
  document.querySelectorAll("[data-theme-pick]").forEach(el=>{
    el.classList.toggle("on", el.dataset.themePick === draft.theme);
  });
  $("#mask").classList.add("on");
  $("#sheet").classList.add("on");
}
function closeSheet(){
  $("#mask").classList.remove("on");
  $("#sheet").classList.remove("on");
  const rs = $("#rSheet");
  if(rs) rs.classList.remove("on");
  editId = null;
  if(draft){ draft = null; document.documentElement.dataset.theme = db.profile.theme; }
}
const GLYPHS = ["助","柚","星","喵","豆","光"];
function paintAvatars(){
  const g = $("#avaGrid");
  const au = draft.theme === "aurora";
  let html = GLYPHS.map((gl,i)=>{
    const c = AVA_COLORS[i % AVA_COLORS.length];
    const bg = au ? "linear-gradient(140deg,#a78bfa,#22d3ee)" : c[0];
    const fg = au ? "#070d20" : c[1];
    const on = draft.avatar.type === "glyph" && draft.avatar.glyph === gl ? " on" : "";
    return `<button class="ava-opt${on}" data-glyph="${gl}" style="background:${bg};color:${fg}">${gl}</button>`;
  }).join("");
  const upOn = draft.avatar.type === "img" ? " on" : "";
  html += `<button class="ava-opt${upOn}" id="upBtn" style="background:rgba(140,140,150,.16);color:currentColor;font-size:16px">＋</button>`;
  g.innerHTML = html;

  g.querySelectorAll("[data-glyph]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const gl = b.dataset.glyph;
      draft.avatar = { type:"glyph", glyph:gl, color:GLYPHS.indexOf(gl), img:null };
      paintAvatars();
    });
  });
  const up = $("#upBtn");
  if(up) up.addEventListener("click", ()=> $("#fileInput").click());
  previewAvatar();
}
function previewAvatar(){
  const av = draft.avatar;
  let html, bg;
  if(av.type === "img" && av.img){
    html = `<img src="${av.img}" alt="">`; bg = "transparent";
  }else if(draft.theme === "aurora"){
    html = `<span>${escapeHTML(av.glyph||"助")}</span>`; bg = "";
  }else{
    const c = AVA_COLORS[(av.color||0) % AVA_COLORS.length];
    html = `<span style="color:${c[1]}">${escapeHTML(av.glyph||"助")}</span>`; bg = c[0];
  }
  document.querySelectorAll(".js-ava").forEach(el=>{
    el.innerHTML = html;
    el.style.background = bg;
  });
}

let editId = null, editKind = "其他";

function openRecord(id){
  const r = db.records.find(x => x.id === id);
  if(!r) return;
  editId = id; editKind = r.kind || "其他";
  $("#rTitle").value = r.title;
  $("#rDue").value = r.due ? toLocalInput(r.due) : "";
  $("#rNote").value = r.note || "";
  paintKinds();
  $("#mask").classList.add("on");
  $("#rSheet").classList.add("on");

function paintKinds(){
  $("#rKinds").innerHTML = KINDS.map(k =>
    `<button class="kind ${k === editKind ? "on" : ""}" data-k="${k}">${k}</button>`).join("");
}
$("#rKinds").addEventListener("click", e=>{
  const b = e.target.closest("[data-k]");
  if(!b) return;
  editKind = b.dataset.k;
  paintKinds();
});
$("#rClose").addEventListener("click", closeSheet);
$("#rSave").addEventListener("click", ()=>{
  const r = db.records.find(x => x.id === editId);
  if(!r){ closeSheet(); return; }
  r.title = ($("#rTitle").value || "").trim() || r.title;
  const v = $("#rDue").value;
  r.due = v ? new Date(v).getTime() : null;
  r.kind = editKind;
  r.note = ($("#rNote").value || "").trim();
  save(); closeSheet(); renderHome(); renderNote();
  toast("已更新");
});
$("#rDel").addEventListener("click", ()=>{
  if(!confirm("删除这一条？删了就找不回来了。")) return;
  db.records = db.records.filter(x => x.id !== editId);
  save(); closeSheet(); renderHome(); renderNote();
  toast("已删除");
});

/* ================= 事件 ================= */
let curTab = "home";
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=> go(t.dataset.view));
});

$("#settingsBtn").addEventListener("click", openSheet);
document.querySelectorAll(".js-ava").forEach(el=> el.addEventListener("click", openSheet));
$("#mask").addEventListener("click", closeSheet);
$("#sheetClose").addEventListener("click", closeSheet);

$("#fName").addEventListener("input", e=>{ draft.name = e.target.value; });
$("#fCall").addEventListener("input", e=>{ draft.call = e.target.value; });

document.querySelectorAll("[data-theme-pick]").forEach(el=>{
  el.addEventListener("click", ()=>{
    draft.theme = el.dataset.themePick;
    document.documentElement.dataset.theme = draft.theme;
    document.querySelectorAll("[data-theme-pick]").forEach(x=>x.classList.toggle("on", x === el));
    paintAvatars();
  });
});

$("#saveBtn").addEventListener("click", ()=>{
  db.profile.name = (draft.name||"").trim() || "小助理";
  db.profile.call = (draft.call||"").trim() || "总裁";
  db.profile.theme = draft.theme;
  db.profile.avatar = draft.avatar;
  save(); closeSheet(); renderAll();
  toast("设置已保存");
});
$("#clearBtn").addEventListener("click", ()=>{
  if(!confirm("确定清除全部记录？这个操作不可恢复。")) return;
  db.records = []; db.chats = []; save(); closeSheet(); renderAll();
  toast("已清空");
});

$("#fileInput").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ev => {
    draft.avatar = { type:"img", glyph:"助", color:0, img:ev.target.result };
    paintAvatars();
  };
  rd.readAsDataURL(f);
  e.target.value = "";
});

$("#sendBtn").addEventListener("click", ()=> send($("#input").value));
const inputEl = $("#input");
const dInputEl = $("#dInput");
function autoGrow(){
  [inputEl, dInputEl].forEach(el=>{
    if(!el) return;
    el.style.height = "auto";
    el.style.height = Math.min(84, el.scrollHeight) + "px";
  });
}
inputEl.addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(inputEl.value); }
});
inputEl.addEventListener("input", autoGrow);
inputEl.addEventListener("focus", ()=>{ if(curView === "home" && !isDesktop()) go("chat"); });

if(dInputEl){
  dInputEl.addEventListener("keydown", e=>{
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(dInputEl.value); }
  });
  dInputEl.addEventListener("input", autoGrow);
}
if($("#dSend")) $("#dSend").addEventListener("click", ()=> send(dInputEl.value));
if($("#settingsBtnD")) $("#settingsBtnD").addEventListener("click", openSheet);
document.querySelectorAll(".sbnav[data-view]").forEach(b=>{
  b.addEventListener("click", ()=> go(b.dataset.view));
});

$("#pasteBtn").addEventListener("click", openImageEntry);
if($("#imgBtnD")) $("#imgBtnD").addEventListener("click", openImageEntry);

// 图片菜单
document.querySelectorAll("[data-pick]").forEach(b=>{
  b.addEventListener("click", ()=>{
    const isCam = b.dataset.pick === "camera";
    closePicker();
    const el = isCam ? $("#camInput") : $("#galInput");
    if(el){ el.value = ""; el.click(); }
  });
});
if($("#pkCancel")) $("#pkCancel").addEventListener("click", closePicker);
$("#picker").addEventListener("click", e=>{ if(e.target === $("#picker")) closePicker(); });

["#camInput","#galInput"].forEach(sel=>{
  const el = $(sel);
  if(!el) return;
  el.addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(f) handleImage(f);
  });
});

// 识别结果：确认 / 丢弃
document.addEventListener("click", e=>{
  const ok = e.target.closest("[data-confirm]");
  if(ok){ e.stopPropagation(); confirmItems(ok.dataset.confirm); return; }
  const no = e.target.closest("[data-discard]");
  if(no){ e.stopPropagation(); discardItems(no.dataset.discard); return; }
});

// 拖拽图片到对话区（桌面）
["#chatPaneBody","#view-chat"].forEach(sel=>{
  const box = $(sel);
  if(!box) return;
  box.addEventListener("dragover", e=>{ e.preventDefault(); box.style.outline = "2px dashed rgba(128,128,140,.5)"; });
  box.addEventListener("dragleave", ()=>{ box.style.outline = ""; });
  box.addEventListener("drop", e=>{
    e.preventDefault(); box.style.outline = "";
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handleImage(f);
  });
});

document.querySelectorAll("[data-quick]").forEach(c=>{
  c.addEventListener("click", ()=>{ send(c.dataset.quick); });
});

// 列表点击 -> 编辑（事件委托）
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){
    e.stopPropagation();
    const r = db.records.find(x => x.id === t.dataset.toggle);
    if(r){ r.done = !r.done; r.doneAt = r.done ? Date.now() : 0; save(); renderHome(); renderNote(); }
    return;
  }
  const o = e.target.closest("[data-open]");
  if(o && !document.querySelector(".sheet.on")){
    // 首页卡片点击也允许进入记事本查看
    openRecord(o.dataset.open);
  }
});

// 粘贴图片
document.addEventListener("paste", e=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type && it.type.indexOf("image") === 0){
      const f = it.getAsFile();
      if(!f) continue;
      e.preventDefault();
      handleImage(f);
      return;
    }
  }
});

/* ================= 启动 ================= */
function seed(){
  if(db.seeded || db.records.length) return;
  const now = new Date();
  const mk = (d,h,m)=>{ const x = new Date(now); x.setHours(h,m,0,0); x.setDate(x.getDate()+d); return x.getTime(); };
  db.records = [
    { id:uid(), title:"数学建模国赛 · 报名", due:mk(3,23,59), kind:"竞赛", note:"三人一队，找队友", done:false, createdAt:Date.now()-DAY*2 },
    { id:uid(), title:"数据结构实验报告", due:mk(1,20,0), kind:"作业", note:"第 5 章，附源码", done:false, createdAt:Date.now()-DAY*3 },
    { id:uid(), title:"四级准考证打印", due:mk(8,12,0), kind:"考试", note:"", done:false, createdAt:Date.now()-DAY },
    { id:uid(), title:"社团招新材料", due:mk(6,22,0), kind:"活动", note:"交到活动中心 302", done:false, createdAt:Date.now()-DAY }
  ];
  db.seeded = true;
  db.chats = [{ role:"a", text:`我是${db.profile.name}。作业、竞赛、考试，凡是带截止时间的，截图或文字丢给我就行。\n需要的时候问我一句「最近有什么要交的」，我会把最急的挑出来。`, t:Date.now() }];
  save();
}
seed();
renderAll();
autoGrow();

// 跨越断点时校正视图
if(desktopMQ.addEventListener){
  desktopMQ.addEventListener("change", ()=>{
    if(isDesktop() && curView === "chat") go("home");
    autoGrow();
  });
}

// 演示用参数：#theme=aurora&view=chat（不写入本地设置）
try{
  const q = new URLSearchParams(location.hash.replace(/^#/,""));
  const th = q.get("theme");
  if(th === "candy" || th === "aurora"){ db.profile.theme = th; renderAll(); }
  const vw = q.get("view");
  if(vw === "chat" || vw === "note" || vw === "home") go(vw);
  if(q.get("sheet") === "1") openSheet();
  if(q.get("edit") === "1" && db.records[0]) openRecord(db.records[0].id);
}catch(e){}

})();
</script>
</body>
</html>
